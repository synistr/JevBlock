<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="ui.css">
<style>
  body { padding: 16px; min-width: 300px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 0 4px; }
  h1 { font-size: 28px; }
  #host { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
  #count { font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .summary { display: flex; align-items: center; gap: 12px; padding: 16px; }
  #labels { list-style: none; margin: 0; padding: 0; }
  #labels:empty { display: none; }
  #labels li { display: flex; justify-content: space-between; min-height: 44px; align-items: center; padding: 0 16px; position: relative; }
  #labels li + li::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 0.5px solid var(--line); }
  #status { font-size: 13px; line-height: 1.4; margin: 7px 16px 0; }
  #status:empty { display: none; }
</style>
</head>
<body>
  <header>
    <h1>JevBlock</h1>
    <span id="host" class="muted small"></span>
  </header>

  <div class="card" style="margin-top: 16px">
    <div class="summary">
      <span id="count">–</span>
      <span class="muted">hidden on this page</span>
    </div>
    <ul id="labels"></ul>
  </div>
  <p id="status" class="muted"></p>

  <h2>This site</h2>
  <div class="card">
    <div class="row"><span>Show hidden elements</span><input type="checkbox" class="switch" id="reveal"></div>
    <div class="row"><span>Pause on this site</span><input type="checkbox" class="switch" id="pause"></div>
  </div>

  <div class="card" style="margin-top: 28px">
    <button class="row-button" id="settings" type="button">Settings</button>
    <button class="row-button danger" id="reset" type="button">Forget this site</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
