<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="ui.css">
<style>
  body { min-width: 300px; padding: 20px; }
  header { display: flex; align-items: center; gap: 12px; }
  header img { width: 36px; height: 36px; border-radius: 8px; }
  header div { min-width: 0; }
  h1 { font-size: 21px; }
  #host { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 13px; }
  .summary { display: flex; align-items: baseline; gap: 10px; margin-top: 24px; }
  #count { font-family: var(--mono); font-size: 44px; font-weight: 600; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  #labels { list-style: none; margin: 14px 0 0; padding: 0; }
  #labels:empty { display: none; }
  #labels li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); }
  #status { margin-top: 12px; }
  #status:empty { display: none; }
  .options { margin-top: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .options label { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; }
  .options label + label { border-top: 1px solid var(--line); }
  .buttons { display: flex; gap: 8px; margin-top: 16px; }
  .buttons button { flex: 1; }
</style>
</head>
<body>
  <header>
    <img src="icon-96.png" alt="">
    <div>
      <h1>JevBlock</h1>
      <span id="host" class="muted"></span>
    </div>
  </header>

  <div class="summary">
    <span id="count">–</span>
    <span class="muted">hidden on this page</span>
  </div>
  <ul id="labels"></ul>
  <p id="status" class="small muted"></p>

  <div class="options">
    <label><input type="checkbox" class="check" id="reveal"><span>Show hidden elements</span></label>
    <label><input type="checkbox" class="check" id="pause"><span>Pause on this site</span></label>
  </div>

  <div class="buttons">
    <button id="settings" type="button">Settings</button>
    <button class="danger" id="reset" type="button">Forget this site</button>
  </div>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
